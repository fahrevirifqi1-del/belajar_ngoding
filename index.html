<!DOCTYPE HTML>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cuaca Modern</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="weather-card">
        <!-- Kotak Pencarian -->
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Cari nama kota..." spellcheck="false">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Informasi Cuaca Utama -->
        <div class="weather-display">
            <div class="weather-icon">
                <i class="fa-solid fa-sun" id="weather-icon-symbol"></i>
            </div>
            <h1 class="temp" id="temp">--°C</h1>
            <h2 class="city" id="city-name">Masukkan Kota</h2>
            <p class="condition" id="condition">--</p>

            <!-- Detail Tambahan -->
            <div class="weather-details">
                <div class="col">
                    <i class="fa-solid fa-droplet"></i>
                    <div>
                        <p class="humidity" id="humidity">--%</p>
                        <span>Kelembapan</span>
                    </div>
                </div>
                <div class="col">
                    <i class="fa-solid fa-wind"></i>
                    <div>
                        <p class="wind" id="wind">-- km/h</p>
                        <span>Angin</span>
                    </div>
                </div>
                <div class="col">
                    <i class="fa-solid fa-gauge"></i>
                    <div>
                        <p class="pressure" id="pressure">-- hPa</p>
                        <span>Tekanan</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fitur Baru: Prakiraan Cuaca 5 Hari -->
        <div class="forecast-section">
            <h3 class="forecast-title">Prakiraan 5 Hari</h3>
            <div class="forecast-list" id="forecast-list">
                <!-- Item prakiraan diisi secara dinamis melalui JavaScript -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
